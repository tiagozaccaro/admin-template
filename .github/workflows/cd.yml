name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: true

jobs:
  build-artifact:
    name: Build production artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack (pnpm)
        run: corepack enable
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter @admin-template/web build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/out

  deploy:
    name: Deploy to production
    needs: build-artifact
    # Production deployment is intentionally NOT enabled until the target
    # infrastructure is confirmed. See docs/development/deployment.md.
    if: false
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: web-build
      - name: Deploy
        run: echo "TODO: configure production deploy step"