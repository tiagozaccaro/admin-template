name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: true

jobs:
  build-artifact:
    name: Build production artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack (pnpm)
        run: corepack enable
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Build web
        run: pnpm --filter @admin-template/web build
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: |
            apps/web/.next/standalone
            apps/web/.next/static
            apps/web/public
          if-no-files-found: error

  deploy:
    name: Deploy to production
    needs: build-artifact
    # Production deployment is intentionally NOT enabled until the target
    # infrastructure is confirmed. See docs/architecture/overview.md.
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: web-build
          path: artifacts/web
      - name: Deploy
        run: |
          echo "TODO: configure production deploy step"
