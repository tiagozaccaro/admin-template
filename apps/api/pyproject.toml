[project]
name = "admin_template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tiago Zaccaro Dias Santana", email = "tiagozaccaro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.30,<1",
    "boto3>=1.34,<2",
    "dramatiq>=1.14,<2",
    "fastapi>=0.143.2",
    "feedparser>=6.0,<7",
    "greenlet>=3.0,<4",
    "httpx>=0.28.1",
    "litellm>=1.0,<2",
    "opentelemetry-api>=1.29,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
    "opentelemetry-sdk>=1.29,<2",
    "pgvector>=0.3,<1",
    "prometheus-client>=0.21,<1",
    "pyjwt[crypto]>=2.10,<3",
    "pydantic>=2.0,<3",
    "pydantic-ai>=0.1,<1",
    "pydantic-settings>=2.16.0",
    "redis>=5.0,<6",
    "s3fs>=2024.0,<2025",
    "sqlalchemy>=2.0,<3",
    "structlog>=24,<25",
    "trafilatura>=0.7,<1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
