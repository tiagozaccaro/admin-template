[project]
name = "admin_template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tiago Zaccaro Dias Santana", email = "tiagozaccaro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.30",
    "fastapi>=0.143.2",
    "greenlet>=3.0",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-sdk>=1.29",
    "prometheus-client>=0.21",
    "pyjwt[crypto]>=2.10",
    "pydantic>=2.0",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.0",
    "structlog>=24",
    "uvicorn[standard]>=0.54.0",
    "authlib>=1.2",
    "redis>=8.1.0",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=50"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "BLE", "C4", "SIM", "S",
]
ignore = [
    "B008",  # FastAPI Depends() in defaults is idiomatic
    "B006",  # mutable default args in function signatures
    "B904",  # raise from in exception chains
    "S101",  # assert usage in tests
    "SIM105",  # try/except/pass -> contextlib.suppress
    "SIM117",  # nested with statements
    "UP028",  # yield over for loop
]

[tool.ruff.lint.per-file-ignores]
"src/admin_template/api/main.py" = ["BLE001", "S110"]
"src/admin_template/modules/agents/health.py" = ["BLE001"]
"src/admin_template/modules/agents/router.py" = ["BLE001"]
"tests/*" = ["S101", "BLE001", "S603", "S602", "S105", "S106"]
