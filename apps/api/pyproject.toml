[project]
name = "admin_template"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tiago Zaccaro Dias Santana", email = "tiagozaccaro@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.143.2",
    "greenlet>=3.0,<4",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.29,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.29,<2",
    "opentelemetry-sdk>=1.29,<2",
    "prometheus-client>=0.21,<1",
    "pyjwt[crypto]>=2.10,<3",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.0,<3",
    "structlog>=24,<27",
    "uvicorn[standard]>=0.54.0",
    "authlib>=1.2,<2",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=50"
testpaths = ["tests"]
