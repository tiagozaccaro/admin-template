apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  labels:
    app: admin-template-agent
data:
  AGENT_HOST: "0.0.0.0"
  AGENT_PORT: "8100"
  AGENT_NAME: "local-agent"
  MODEL: "test"
  MODEL_PROVIDER: "openai"
  API_URL: "http://admin-template-api:8000"
  ALLOW_SHELL: "false"
  REQUIRE_APPROVAL_FOR_DESTRUCTIVE: "true"
  SKILLS_DIR: "skills"
  SESSION_STORE_PATH: ".agent-sessions.json"
  AUDIT_LOG_PATH: "audit.log"
  OTLP_ENDPOINT: "http://otel-collector:4318/v1/traces"
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
  labels:
    app: admin-template-agent
type: Opaque
stringData:
  MODEL_API_KEY: ""
  MODEL_API_BASE: ""
  AGENT_TOKEN: ""
  AGENT_ADMIN_TOKEN: ""
  API_TOKEN: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  labels:
    app: admin-template-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-template-agent
  template:
    metadata:
      labels:
        app: admin-template-agent
    spec:
      containers:
        - name: agent
          image: admin-template-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8100
              name: http
          envFrom:
            - configMapRef:
                name: agent-config
            - secretRef:
                name: agent-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8100
            initialDelaySeconds: 10
            periodSeconds: 30
          volumeMounts:
            - name: skills
              mountPath: /app/skills
            - name: data
              mountPath: /app
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: skills
          emptyDir: {}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: agent
  labels:
    app: admin-template-agent
spec:
  type: ClusterIP
  ports:
    - port: 8100
      targetPort: 8100
      name: http
  selector:
    app: admin-template-agent
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agent
  labels:
    app: admin-template-agent
spec:
  rules:
    - host: agent.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agent
                port:
                  number: 8100