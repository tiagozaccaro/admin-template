name: admin-template

networks:
  edge:
    name: admin-template-edge
    driver: bridge
  app:
    name: admin-template-app
    driver: bridge
  data:
    name: admin-template-data
    driver: bridge

volumes:
  pg_data:
  redis_data:
  keycloak_data:

services:
  postgres:
    image: postgres:16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin-template}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin-template}
      POSTGRES_DB: ${POSTGRES_DB:-admin-template}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [data, app]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    networks: [app, edge]
    ports:
      - "8080:8080"

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-admin-template}:${POSTGRES_PASSWORD:-admin-template}@postgres:5432/${POSTGRES_DB:-admin-template}
      REDIS_URL: redis://redis:6379
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/admin-template/protocol/openid-connect/certs
      KEYCLOAK_ISSUER: http://keycloak:8080/realms/admin-template
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks: [app, edge]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    networks: [app, edge]
    ports:
      - "3000:3000"

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    networks: [edge]
    ports:
      - "80:80"
      - "443:443"
    profiles: ["edge"]
